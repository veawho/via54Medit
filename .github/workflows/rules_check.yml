name: via54 6 步规则校验

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'scripts/via54_highlight_fix_v10.py'
      - 'scripts/via54_rules.py'
      - 'scripts/step5_alignment.py'
      - 'scripts/l0_paper_match.py'
      - 'scripts/l4_keyword_extract.py'
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 手动触发

jobs:
  rules-check:
    name: 6 步规则 + 单测
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pymupdf pillow numpy python-pptx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 单测 — highlight v10
        run: |
          cd scripts
          python3.11 -m unittest test_via54_highlight_fix_v10 -v

      - name: 单测 — rules
        run: |
          cd scripts
          python3.11 -m unittest test_via54_rules -v

      - name: 规则打印 (供 review 看)
        run: |
          python3.11 scripts/via54_rules.py print-rules | head -50

      - name: 规则校验 (示例项目)
        run: |
          python3.11 scripts/via54_rules.py check . --verbose || true

      - name: 6 步规则完整跑分
        run: |
          python3.11 scripts/multi_project_diff.py 2>&1 | tail -40 || true

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: via54-rules-report
          path: |
            docs/multi_project_diff_*.md
            _health_report.json
          if-no-files-found: ignore
          retention-days: 30
