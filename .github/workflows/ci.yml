name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---- Go: build + vet + race tests on 3 OSes ----
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build all packages
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Race tests
        run: go test -race -timeout 300s ./...

  # ---- Python toolchain: deps + unit tests (no data needed) ----
  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Python encoding guard (Windows GBK console)
        run: |
          echo "PYTHONIOENCODING=utf-8" >> $GITHUB_ENV

      - name: TMA pipeline tests
        working-directory: scripts
        run: python -m unittest test_tma_pipeline

      - name: hl_lib (v3 FINAL) tests
        working-directory: scripts/hl_v3_final
        run: python test_hl_lib.py

      - name: forbidden zones (v3 FINAL) tests
        working-directory: scripts/hl_v3_final
        run: python test_forbidden_zones.py

      - name: Toolchain imports (cross-platform surface)
        working-directory: scripts
        run: |
          # 渲染链路相关的模块必须一并探测到 —— 它们以前不在这个清单里, 于是
          # 渲染侧的平台问题在 Windows/Linux 上要到跑测试才暴露(甚至不暴露)。
          python -c "import sys; sys.path[:0] = ['.', 'hl_v3_final']; import deps_auto, ppt_render_engine, tma_verify_highlights, via54_auto, via54_highlight_v3_final, unified_render_engine, render_doctor, graph_render, bootstrap_device, deploy_scan, install_mmx; print('imports OK')"

      - name: Deploy scanner tests (platform-aware capability matrix)
        working-directory: scripts
        run: python -m unittest test_deploy_scan

      - name: LLM ledger tests (记账链路不许悄悄退化)
        # 记账是旁路: 一条路径不再记录 token, 调用不会报错、不会有非零退出码,
        # 报表只是安静地少一块。实测抓到过两处(provider_llm.py 返回 usage 却不写库、
        # Go 侧 llm.go 整个丢弃 usage), 都不会让任何测试变红 —— 所以这组测试
        # 连"探测器自身能否发现退化"一起测。
        run: python -m unittest tests.test_llm_ledger

      - name: LLM integration verification (which LLMs, and can we read their tokens)
        working-directory: scripts
        # 与部署/更新时跑的是**同一条**命令、同一份渲染逻辑(telemetry/llm_providers.py)。
        # 这里跑的是离线部分: 扫源码找记账调用点 + 各 provider 的端到端摄入校验 +
        # Go 侧 spool 链路校验。凭据可达性需要 --llm-live, CI 里没有真 key, 不跑。
        run: python deploy_scan.py --verify-llm

      - name: Deploy scan — platform classification self-check
        working-directory: scripts
        # 断言"平台分类与宿主一致"的逻辑放在脚本里(而不是写在这份 YAML 里) ——
        # 最初写在 YAML 里, 用了 `2>/dev/null` 与 `|| true`, 在 Windows 跑者的
        # PowerShell 下直接崩("Could not find a part of the path 'D:\dev\null'")。
        # 这里**不断言全绿**: 跑者镜像没有桌面 Office/OCR, 缺缺口是正常的;
        # 要验的是非 Windows 上 pywin32 必须是 na、Linux 上 Office 必须是 na。
        run: python deploy_scan.py --verify-platform

      - name: Deploy scan — dry-run is side-effect free
        working-directory: scripts
        # --dry-run 必须能跑通且**退出 0**(只报计划)。它不该在三个平台上因用法/平台
        # 差异而失败。这里刻意不写任何 shell 重定向, 也不断言语义 —— "绝不落地"这条
        # 由 test_deploy_scan.py 的 TestDryRun 在三个跑者上分别验证。
        run: python deploy_scan.py --dry-run --skip-heavy

      # 注: 渲染通道的"真出图"探针 (scripts/render_doctor.py) **故意不放进 CI** ——
      # 跑者的镜像里没有(也不该有)桌面版 PowerPoint/Word, 它必然报不可用。
      # 那一步在真机上跑: python3 scripts/render_doctor.py
